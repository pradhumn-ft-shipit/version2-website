# Render Blueprint (Infrastructure as Code) — the live source of truth for the
# static site's build, env vars, and routing.
#
# IMPORTANT: `name` MUST exactly match the existing Render service
# (version2-website). On a matching name, Render ADOPTS the existing service and
# applies this config to it. On a mismatch, Render creates a DUPLICATE service
# (with a name suffix) that won't have the custom domain — so don't rename this.
#
# To activate: Render dashboard → New → Blueprint → pick this repo/branch →
# Apply. After that, every push to main reconciles the service to this file.
#
# ⚠️ GOTCHA — Blueprint sync does NOT delete redirect/rewrite rules. Adding a
# route here works, but REMOVING one does not take effect: Render keeps the rule
# on the service and a Blueprint sync reports "Resources already up to date"
# while the old redirect keeps firing (a fresh 301 from origin, not a CDN cache).
# To remove/change a route you MUST also delete it by hand in the dashboard:
#   Service (version2-website) → Settings → Redirect and Rewrite Rules.
# (This is how the /fpa → /contact redirect was finally removed when /fpa
# became a real page — editing this file alone did nothing.)

services:
  - type: web
    name: version2-website
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      # Pin Node to match GitHub Actions (Render otherwise defaults to 24.x).
      - key: NODE_VERSION
        value: "20"
      # The contact form lives on the Cloudflare worker (*.pages.dev), not Render.
      - key: VITE_CONTACT_API_URL
        value: https://version2-website.pages.dev/api/contact
    # Redirect rules MUST come before the SPA catch-all rewrite so they win.
    routes:
      # /fpa is a real page now (FPA-member Meeting Assistant landing), not a redirect.
      - type: redirect
        source: /aon
        destination: /contact
      - type: redirect
        source: /onepagecrm
        destination: /contact
      # /blog is a redirect-only route (canonical blog index is /resources/blog).
      # Serve a real 301 here instead of the catch-all homepage shell.
      - type: redirect
        source: /blog
        destination: /resources/blog
      # Legacy / renamed URLs that only redirect (app/routes/redirects/*). These
      # MUST be real 301s, not rewrites: rewriting them serves React Router's
      # prerendered redirect stub, which shows an ugly "Redirecting from X to Y"
      # page with a 2-second <meta refresh> delay before it moves the user.
      # A host 301 is instant and invisible (and correct for SEO).
      - type: redirect
        source: /about
        destination: /
      - type: redirect
        source: /resources/podcast
        destination: /resources/blog
      - type: redirect
        source: /resources/blog/*
        destination: /blog/*
      - type: redirect
        source: /for-acquisitive-rias
        destination: /who-we-serve/acquisitive-rias
      - type: redirect
        source: /for-breakaway-advisors
        destination: /who-we-serve/breakaway-advisors
      - type: redirect
        source: /for-custodians
        destination: /who-we-serve/custodians
      - type: redirect
        source: /for-ibds
        destination: /who-we-serve/independent-broker-dealers
      - type: redirect
        source: /for-transition-consultants
        destination: /who-we-serve/transition-consultants
      # Renamed breakaway case-study slug. Must precede the /case-study/* rewrite
      # below so the old URL 301s instead of being rewritten to a missing file.
      - type: redirect
        source: /case-study/schwab-to-schwab-transition-one-day
        destination: /case-study/independent-breakaway-setup
      # Prerendered content pages. `react-router build` writes a full-content
      # dist/<route>/index.html per article (framework-mode SSG). These rewrites
      # MUST come before the catch-all below: a bare SPA rewrite swallows the
      # prerendered file and serves the generic shell instead, which is exactly
      # what we're avoiding — verified locally, `serve -s` returns the shell for
      # these paths without the explicit rewrite.
      - type: rewrite
        source: /resources/news
        destination: /resources/news/index.html
      - type: rewrite
        source: /resources/news/*
        destination: /resources/news/*/index.html
      - type: rewrite
        source: /resources/blog
        destination: /resources/blog/index.html
      - type: rewrite
        source: /blog/*
        destination: /blog/*/index.html
      - type: rewrite
        source: /resources/podcasts
        destination: /resources/podcasts/index.html
      - type: rewrite
        source: /resources/podcasts/*
        destination: /resources/podcasts/*/index.html
      # Static marketing / solutions / ICP / legal routes are ALSO prerendered
      # (dist/<route>/index.html) and must be served as their own file, not the
      # SPA shell — same reason as blog/news above. The catch-all `/*` below
      # would otherwise swallow every one of these and serve the homepage,
      # which defeats the SSG crawlability goal for these pages.
      #
      # NOTE: this list mirrors the fully-static routes enumerated by
      # getStaticPaths() (app/routes.ts). If you add a new static marketing
      # route, add a rewrite here too (or it will silently serve the homepage
      # shell to crawlers). Prefix wildcards cover multi-child sections.
      - type: rewrite
        source: /solutions/*
        destination: /solutions/*/index.html
      - type: rewrite
        source: /who-we-serve/*
        destination: /who-we-serve/*/index.html
      - type: rewrite
        source: /case-study/*
        destination: /case-study/*/index.html
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /contact
        destination: /contact/index.html
      - type: rewrite
        source: /fpa
        destination: /fpa/index.html
      - type: rewrite
        source: /resources-for-financial-advisors
        destination: /resources-for-financial-advisors/index.html
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy/index.html
      - type: rewrite
        source: /privacy-policy-transitions
        destination: /privacy-policy-transitions/index.html
      - type: rewrite
        source: /client-privacy-notice
        destination: /client-privacy-notice/index.html
      - type: rewrite
        source: /client-data-consent-acknowledgment
        destination: /client-data-consent-acknowledgment/index.html
      - type: rewrite
        source: /tos
        destination: /tos/index.html
      - type: rewrite
        source: /tos-transitions
        destination: /tos-transitions/index.html
      - type: rewrite
        source: /zoom-help-documentation
        destination: /zoom-help-documentation/index.html
      # SPA deep-link fallback — every other path serves the app shell so
      # React Router can handle it (and hard refreshes on /blog/<post> work).
      - type: rewrite
        source: /*
        destination: /index.html
