      # W3 glossary hub + entries, and W5 author archive pages. Prerendered
      # static routes that likewise need their own rewrite before the catch-all.
      - type: rewrite
        source: /glossary
        destination: /glossary/index.html
      - type: rewrite
        source: /glossary/*
        destination: /glossary/*/index.html
      - type: rewrite
        source: /authors/*
        destination: /authors/*/index.html
      # SPA deep-link fallback — every other path serves the app shell so
      # React Router can handle it (and hard refreshes on /blog/<post> work).
      - type: rewrite
        source: /*
        destination: /index.html
