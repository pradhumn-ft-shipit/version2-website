# Render Blueprint (Infrastructure as Code) — the live source of truth for the
# static site's build, env vars, and routing.
#
# IMPORTANT: `name` MUST exactly match the existing Render service
# (version2-website). On a matching name, Render ADOPTS the existing service and
# applies this config to it. On a mismatch, Render creates a DUPLICATE service
# (with a name suffix) that won't have the custom domain — so don't rename this.
#
# To activate: Render dashboard → New → Blueprint → pick this repo/branch →
# Apply. After that, every push to main reconciles the service to this file.
#
# ⚠️ GOTCHA — Blueprint sync does NOT delete redirect/rewrite rules. Adding a
# route here works, but REMOVING one does not take effect: Render keeps the rule
# on the service and a Blueprint sync reports "Resources already up to date"
# while the old redirect keeps firing (a fresh 301 from origin, not a CDN cache).
# To remove/change a route you MUST also delete it by hand in the dashboard:
#   Service (version2-website) → Settings → Redirect and Rewrite Rules.
# (This is how the /fpa → /contact redirect was finally removed when /fpa
# became a real page — editing this file alone did nothing.)

services:
  - type: web
    name: version2-website
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      # Pin Node to match GitHub Actions (Render otherwise defaults to 24.x).
      - key: NODE_VERSION
        value: "20"
      # The contact form lives on the Cloudflare worker (*.pages.dev), not Render.
      - key: VITE_CONTACT_API_URL
        value: https://version2-website.pages.dev/api/contact
    # Long-lived browser caching for files whose URL changes when their content
    # does: Vite's content-hashed bundles under /assets, and the self-hosted
    # fonts (rename the file if a font is ever replaced). HTML is left on
    # Render's default so new deploys show up immediately.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Redirect rules come first, then the generated exact rewrites (PR2-10).
    routes:
      # "The $100M Line" Fidelity report and the /research section were withdrawn
      # (2026-10-09). Render keeps files from earlier deploys, so deleting them from
      # public/ alone would leave them reachable; send every old link home.
      - type: redirect
        source: /downloads/fasttrackr-fidelity-100m-line-methodology.pdf
        destination: /
      - type: redirect
        source: /downloads/fasttrackr-fidelity-100m-line-report.pdf
        destination: /
      - type: redirect
        source: /research-images/*
        destination: /
      - type: redirect
        source: /research
        destination: /
      - type: redirect
        source: /research/
        destination: /
      - type: redirect
        source: /research/*
        destination: /
      # PR1-10 (2026-11-04): the /fpa landing page (FPA-member Meeting Assistant
      # discount) is retired and 301s to /contact again. After deploy, prune its
      # old /fpa -> /fpa/index.html rewrite in the dashboard by hand.
      - type: redirect
        source: /fpa
        destination: /contact
      - type: redirect
        source: /aon
        destination: /contact
      - type: redirect
        source: /onepagecrm
        destination: /contact
      # PR1-06 (2026-11-04): the Meeting Assistant, Document Intelligence and
      # Client Onboarding module pages are retired; the site covers advisor
      # transitions only. Their useful parts live in the "How the data gets in"
      # section (#data-collection) of /solutions/advisor-transitions. The
      # destination has no #fragment because Render's docs don't say fragments
      # are kept; switch to /solutions/advisor-transitions#data-collection once
      # that's confirmed live. These MUST precede the /solutions/* rewrite below.
      # After deploy, prune any old dashboard rules for these paths by hand.
      - type: redirect
        source: /solutions/meeting-assistant
        destination: /solutions/advisor-transitions
      - type: redirect
        source: /solutions/document-intelligence
        destination: /solutions/advisor-transitions
      - type: redirect
        source: /solutions/client-onboarding
        destination: /solutions/advisor-transitions
      # PR1-09 (2026-11-04): the /resources-for-financial-advisors hub is retired
      # (most of its sections were off-topic). /resources/blog still prerenders a
      # link to every post. Re-point to the transitions hub when it exists (PR6).
      # After deploy, prune its old rewrite rule in the dashboard by hand.
      - type: redirect
        source: /resources-for-financial-advisors
        destination: /blog/category/advisor-transitions-and-repapering
      # /blog is a redirect-only route (canonical blog index is /resources/blog).
      # Serve a real 301 here instead of the catch-all homepage shell.
      - type: redirect
        source: /blog
        destination: /resources/blog
      # Legacy / renamed URLs that only redirect (app/routes/redirects/*). These
      # MUST be real 301s, not rewrites: rewriting them serves React Router's
      # prerendered redirect stub, which shows an ugly "Redirecting from X to Y"
      # page with a 2-second <meta refresh> delay before it moves the user.
      # A host 301 is instant and invisible (and correct for SEO).
      # PR3-07 (2026-11-04): the /about -> / redirect is gone; /about is a page.
