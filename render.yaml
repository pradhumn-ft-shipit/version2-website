# Render Blueprint (Infrastructure as Code) — the live source of truth for the
# static site's build, env vars, and routing.
#
# IMPORTANT: `name` MUST exactly match the existing Render service
# (version2-website). On a matching name, Render ADOPTS the existing service and
# applies this config to it. On a mismatch, Render creates a DUPLICATE service
# (with a name suffix) that won't have the custom domain — so don't rename this.
#
# To activate: Render dashboard → New → Blueprint → pick this repo/branch →
# Apply. After that, every push to main reconciles the service to this file.
#
# ⚠️ GOTCHA — Blueprint sync does NOT delete redirect/rewrite rules. Adding a
# route here works, but REMOVING one does not take effect: Render keeps the rule
# on the service and a Blueprint sync reports "Resources already up to date"
# while the old redirect keeps firing (a fresh 301 from origin, not a CDN cache).
# To remove/change a route you MUST also delete it by hand in the dashboard:
#   Service (version2-website) → Settings → Redirect and Rewrite Rules.
# (This is how the /fpa → /contact redirect was finally removed when /fpa
# became a real page — editing this file alone did nothing.)

services:
  - type: web
    name: version2-website
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      # Pin Node to match GitHub Actions (Render otherwise defaults to 24.x).
      - key: NODE_VERSION
        value: "20"
      # The contact form lives on the Cloudflare worker (*.pages.dev), not Render.
      - key: VITE_CONTACT_API_URL
        value: https://version2-website.pages.dev/api/contact
    # Redirect rules MUST come before the SPA catch-all rewrite so they win.
    routes:
      # /fpa is a real page now (FPA-member Meeting Assistant landing), not a redirect.
      - type: redirect
        source: /aon
        destination: /contact
      - type: redirect
        source: /onepagecrm
        destination: /contact
      # /blog is a redirect-only route (canonical blog index is /resources/blog).
      # Serve a real 301 here instead of the catch-all homepage shell.
      - type: redirect
        source: /blog
        destination: /resources/blog
      # Legacy / renamed URLs that only redirect (app/routes/redirects/*). These
      # MUST be real 301s, not rewrites: rewriting them serves React Router's
      # prerendered redirect stub, which shows an ugly "Redirecting from X to Y"
      # page with a 2-second <meta refresh> delay before it moves the user.
      # A host 301 is instant and invisible (and correct for SEO).
      - type: redirect
        source: /about
        destination: /
      - type: redirect
        source: /resources/podcast
        destination: /resources/blog
      - type: redirect
        source: /resources/blog/*
        destination: /blog/*
      - type: redirect
        source: /for-acquisitive-rias
        destination: /who-we-serve/acquisitive-rias
      - type: redirect
        source: /for-breakaway-advisors
        destination: /who-we-serve/breakaway-advisors
      - type: redirect
        source: /for-custodians
        destination: /who-we-serve/custodians
      - type: redirect
        source: /for-ibds
        destination: /who-we-serve/independent-broker-dealers
      - type: redirect
        source: /for-transition-consultants
        destination: /who-we-serve/transition-consultants
      # Renamed breakaway case-study slug. Must precede the /case-study/* rewrite
      # below so the old URL 301s instead of being rewritten to a missing file.
      - type: redirect
        source: /case-study/schwab-to-schwab-transition-one-day
        destination: /case-study/independent-breakaway-setup
      # W4 content consolidation: near-duplicate posts (identical/near-identical
      # bodies, or -humanized / slug variants), all dated before 2026-09-01, 301
      # into their canonical. Loser sources were removed from content/, so these
      # redirects preserve link equity. MUST precede the /blog/* rewrite below.
      - type: redirect
        source: /blog/transition-platforms-salesforce-schwab-fidelity-pershing-integrations
        destination: /blog/salesforce-schwab-fidelity-pershing-native-transition-integrations
      - type: redirect
        source: /blog/osj-technology-faq-what-every-office-of-supervisory-jurisdiction-needs-to-know-about-transition-automation
        destination: /blog/osj-technology-and-advisor-transitions-a-complete-automation-guide-for-office-of-supervisory-jurisdiction
